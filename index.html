<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #102a43;
    }
    .card {
      background: #ffffff;
      max-width: 520px;
      width: 100%;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 12px; }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #102a43;
      margin-bottom: 20px;
    }
    .main-text,
    .dedication {
      font-size: 1.05rem;
      line-height: 1.65;
      color: #334e68;
      white-space: pre-wrap;
      text-align: left;
    }
    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 12px 0;
    }
    .dedication:empty,
    .divider:has(+ .dedication:empty) {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎓</div>
    <h1>Alleluia!</h1>
    <div class="main-text">[TEXT]</div>
    <div class="divider"></div>
    <div class="dedication">[ADDITIONAL_TEXT]</div>
  </div>
</body>
</html>
